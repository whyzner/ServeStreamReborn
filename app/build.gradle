apply plugin: 'com.android.application'

android {
    namespace 'net.sourceforge.servestream'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        // ServeStream Classic: the app as it was right before the new look
        // (Material 3 and later). Its own package, so it installs next to ServeStream.
        applicationId "net.sourceforge.servestream.classic"
        minSdk 21
        targetSdk 36
        versionName "1.0.1"
        versionCode 2
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        // fixed key so new builds install as updates over older ones
        stable {
            storeFile file('servestream-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        debug {
            // non-debuggable build: ART CheckJNI stays off, like the original release APK
            debuggable false
            jniDebuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ['src/main/libs']
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

def ndkDir = android.ndkDirectory

tasks.register('buildFFmpeg', Exec) {
    description = 'Compile FFmpeg and OpenSSL via NDK'
    commandLine 'bash', file('src/main/ffmpeg/build_ffmpeg_modern.sh').absolutePath,
            ndkDir.absolutePath, 'arm64-v8a', 'armeabi-v7a', 'x86_64'
}

tasks.register('buildNative', Exec) {
    description = 'Compile JNI source via NDK'
    dependsOn 'buildFFmpeg'
    commandLine "$ndkDir/ndk-build",
            'NDK_APPLICATION_MK=Application.mk',
            '-C', file('src/main/jni').absolutePath,
            '-j', Runtime.runtime.availableProcessors(),
            'all',
            'NDK_DEBUG=0'
}

tasks.register('cleanNative', Exec) {
    description = 'Clean JNI object files'
    commandLine "$ndkDir/ndk-build", '-C', file('src/main/jni').absolutePath, 'clean'
}

tasks.named('preBuild') { dependsOn 'buildNative' }
tasks.named('clean') { dependsOn 'cleanNative' }

dependencies {
    implementation files('libs/jplaylistparser-0.2.5.jar')
    implementation files('libs/jsoup-1.8.1.jar')
    implementation project(':dslv')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
