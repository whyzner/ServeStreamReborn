name: SBS diag
on:
  push:
    branches: [diag-sbs]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          M=$(curl -s -m 15 'https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm' | tr -d '\r\n')
          B=${M%%\?*}; B=${B%/*}
          curl -s -m 15 -c jar -D h1 -o m.m3u8 "$M"; grep -i "set-cookie\|location" h1 | sed 's/=.*/=.../' || true
          echo "chunklist no token: $(curl -s -m 15 -o cl.m3u8 -w '%{http_code}' "$B/chunklist.m3u8")"; head -8 cl.m3u8 | sed 's/[?].*/?.../'
          echo "chunklist with cookie: $(curl -s -m 15 -b jar -o cl2.m3u8 -w '%{http_code}' "$B/chunklist.m3u8")"; head -8 cl2.m3u8 | sed 's/[?].*/?.../'
          Q=${M#*\?}; echo "chunklist with token: $(curl -s -m 15 -o cl3.m3u8 -w '%{http_code}' "$B/chunklist.m3u8?$Q")"; head -8 cl3.m3u8 | sed 's/[?].*/?.../'
          E='https://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8'
          for u in "$E" "$M"; do echo "== ffprobe ${u%%\?*}"; timeout 40 ffprobe -hide_banner -v info "$u" 2>&1 | grep -E "Input|Stream|error|Error|HTTP|403" | sed 's/[?][^ ]*//' | head -8; done
          ffprobe -version | head -1
