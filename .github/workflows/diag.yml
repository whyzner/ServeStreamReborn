name: SBS diag
on:
  push:
    branches: [diag-sbs]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for A in 'Lavf/61.7.100' 'Lavf53.32.100' 'Dalvik/2.1.0 (Linux; U; Android 16; SM-F981N)' 'stagefright/1.2 (Linux;Android 16)' 'curl/8' 'Mozilla/5.0' 'ServeStream' 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'; do
            M=$(curl -s -m 15 'https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm' | tr -d '\r\n')
            C=$(curl -s -m 15 -A "$A" "$M" | grep -v '^#' | head -1)
            B=${M%%\?*}; B=${B%/*}
            echo "[$A] -> ${C:0:40} child=$(curl -s -m 15 -A "$A" -o /dev/null -w '%{http_code}' "$B/$C")"
          done
