name: SBS diag
on:
  push:
    branches: [diag-sbs]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          M=$(curl -s -m 15 'https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm' | tr -d '\r\n')
          B=${M%%\?*}; B=${B%/*}; Q=${M#*\?}
          curl -s -m 15 -A 'Mozilla/5.0 (Linux; Android 16) Chrome/131 Mobile Safari/537.36' "$M" | grep -v '^#'
          curl -s -m 15 "$B/chunklist.m3u8?$Q" -o cl.m3u8; S=$(grep -v '^#' cl.m3u8 | tail -1)
          echo "segment no token: $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$B/$S")"
          echo "segment with token: $(curl -s -m 15 -o seg -w '%{http_code} %{content_type} %{size_download}' "$B/$S?$Q")"
          K=$(curl -s -m 15 'https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/24' | grep -o '"service_url":"[^"]*' | head -1 | cut -d'"' -f4)
          KB=${K%%\?*}; KB=${KB%/*}; KQ=${K#*\?}
          echo "kbs master: $(curl -s -m 15 -o k.m3u8 -w '%{http_code}' "$K")"; grep -v '^#' k.m3u8 | head -3 | sed 's/[?].*/?.../'
          KC=$(grep -v '^#' k.m3u8 | head -1)
          case "$KC" in http*) ;; *) echo "kbs child no token: $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$KB/$KC")"; echo "kbs child with token: $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$KB/$KC?$KQ")";; esac
