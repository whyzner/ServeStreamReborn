name: SBS diag
on:
  push:
    branches: [diag-sbs]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          M=$(curl -s -m 15 'https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm' | tr -d '\r\n')
          echo "mbc -> ${M%%\?*}"
          echo "mbc stream $(curl -s -m 15 -o mbc.m3u8 -w '%{http_code} %{content_type}' "$M")"; sed 's/[?].*//' mbc.m3u8 | head
          E='https://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8'
          curl -s -m 15 "$E" | head
          K=$(curl -s -m 15 'https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/21' | head -c 400); echo "kbs: $(echo "$K" | sed 's/Signature=[^&"]*/Signature=X/g' | head -c 300)"
          which ffprobe && for u in "$E" "$M"; do timeout 40 ffprobe -hide_banner "$u" 2>&1 | grep -E "Input|Stream|Duration|error|Error" | sed 's/[?][^ ]*//' | head -8; done || true
