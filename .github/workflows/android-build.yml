name: ServeStream Classic Build

on:
  workflow_dispatch:
  push:
    branches: [classic]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager was not found in $SDK_ROOT"
            find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: app/src/main/jni/ffmpeg/ffmpeg
          key: ffmpeg-ndk27.2-x86_64-${{ hashFiles('app/src/main/ffmpeg/build_ffmpeg_modern.sh') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check 16 KB page alignment
        run: bash .github/scripts/check16k.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServeStreamClassic
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error


  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ServeStreamClassic
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/scripts/classic_check.sh

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ServeStreamClassic
          path: apk

      - name: Publish release (ServeStream Classic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          src=$(find apk -name '*.apk' | head -1)
          file="ServeStreamClassic-$ver.apk"
          cp "$src" "$file"
          REPO="${{ github.repository }}"
          gh release delete "classic-v$ver" --repo "$REPO" --cleanup-tag --yes || true
          # this version's section of CHANGELOG.md as the release notes
          awk -v v="## $ver " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nServeStream Classic: Material 3 개편 직전 화면 그대로, 버그만 고침. ServeStream과 따로 설치됨 (net.sourceforge.servestream.classic). 빌드 커밋 %s\n' "${GITHUB_SHA::7}" >> notes.md
          gh release create "classic-v$ver" "$file" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "ServeStream Classic $ver" --notes-file notes.md --latest=false
